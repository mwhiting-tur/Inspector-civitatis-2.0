name: Ejecutar Scraping Semanal USD Lunes (Civitatis -> BQ)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ==========================================
  # JOB 1: Limpiar BQ y fijar esquema estricto
  # ==========================================
  setup-bq:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias para BQ
        run: pip install pandas google-cloud-bigquery[pandas] pyarrow db-dtypes

      - name: Ejecutar script de limpieza BQ
        run: python civitatis/setup_bq_civitatis.py

  # ==========================================
  # JOB 2: Scraper Playwright en Matriz Paralela
  # ==========================================
  run-scraper:
    needs: setup-bq # Obliga a esperar que el Job 1 prepare la tabla
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - country: "Chile"
            currency: "USD"
          - country: "México"
            currency: "USD"
          - country: "Perú"
            currency: "USD"
          - country: "Colombia"
            currency: "USD"
          - country: "Argentina"
            currency: "USD"
          - country: "Brasil"
            currency: "USD"
          - country: "Costa Rica"
            currency: "USD"
          - country: "Panamá"
            currency: "USD"
          - country: "Ecuador"
            currency: "USD"
          - country: "Paraguay"
            currency: "USD"
          - country: "Uruguay"
            currency: "USD"
          - country: "Bolivia"
            currency: "USD"

    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas google-cloud-bigquery[pandas] pyarrow db-dtypes beautifulsoup4 requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Instalar Navegador y Dependencias de Sistema
        run: |
          python -m playwright install chromium --with-deps

      - name: Ejecutar Scraper y subir a BQ
        env:
          PYTHONUNBUFFERED: 1
        run: PYTHONPATH=$GITHUB_WORKSPACE python -u civitatis/main_semanal.py "${{ matrix.country }}" "${{ matrix.currency }}"

      - name: Subir CSV resultante como respaldo
        uses: actions/upload-artifact@v4
        with:
          name: precios-${{ matrix.country }}
          path: data/precios_*.csv
          if-no-files-found: warn