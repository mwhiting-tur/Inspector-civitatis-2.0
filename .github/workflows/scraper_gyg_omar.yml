name: GYG Reviews Scraper - Destinos Omar

on:
  workflow_dispatch: {}


jobs:
  # ==========================================
  # JOB 1: Ubicar actividades de los destinos pedidos y preparar BigQuery
  # ==========================================
  extract_sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias
        run: pip install pandas requests google-cloud-bigquery[pandas] pyarrow db-dtypes

      - name: Ejecutar script de sitemaps y preparar BigQuery
        run: python gyg/gyg_sitemap_omar_github.py

      - name: Subir CSVs de destinos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: sitemaps_omar_data
          path: tours_urls_*.csv
          retention-days: 1

  # ==========================================
  # JOB 2: Scraper de reviews en paralelo (1 runner por destino) + carga a BigQuery
  # ==========================================
  extract_reviews_and_upload:
    needs: extract_sitemaps
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 horas máximo por destino (Roma/Tokio son los más grandes)
    strategy:
      fail-fast: false  # si un destino falla, los demás siguen
      max-parallel: 10
      matrix:
        destino:
          - madrid-l46
          - barcelona-l45
          - sevilla-l48
          - granada-l207
          - cordoba-l1689
          - roma-l33
          - florencia-l32
          - venecia-l35
          - lisboa-l42
          - porto-l151
          - paris-l16
          - londres-l57
          - amsterdam-l36
          - nueva-york-l59
          - orlando-l191
          - los-angeles-l179
          - tokio-l193
          - sidney-l200
          - bangkok-l169
          - singapur-l170

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar CSVs del job anterior
        uses: actions/download-artifact@v4
        with:
          name: sitemaps_omar_data

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias
        run: pip install pandas requests google-cloud-bigquery[pandas] pyarrow db-dtypes

      - name: Scrapear reviews de ${{ matrix.destino }}
        env:
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python gyg/scraper_gyg_omar_github.py ${{ matrix.destino }}
