name: Operadores Civitatis (sitio completo) -> BigQuery

# Ejecución manual. Motor HTTP: una petición por ficha, sin navegador y sin
# proxy. Sube a datatur.supply.operators_civitatis en lotes incrementales.
# Si corta, relanzá con el MISMO fecha_scan y reanuda donde quedó.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner. ubuntu-latest es IP de datacenter; self-hosted sale por IP propia pero HAY QUE TENER UNO REGISTRADO (si no, el job queda encolado para siempre).'
        type: choice
        options: ['ubuntu-latest', 'self-hosted']
        required: true
        default: 'ubuntu-latest'
      fecha_scan:
        description: 'YYYY-MM-DD. Vacío = hoy (UTC). Poné la fecha de una corrida previa para CONTINUARLA.'
        required: false
        default: ''
      total_shards:
        description: 'Shards. Ojo: en un runner self-hosted todos comparten la misma IP.'
        required: true
        default: '4'
      max_paralelo:
        description: 'Shards simultáneos'
        required: true
        default: '2'
      concurrencia:
        description: 'Fichas en paralelo dentro de un shard'
        required: true
        default: '4'
      pausa:
        description: 'Segundos entre fichas. Subir si aparecen 429.'
        required: true
        default: '0.3'
      paises:
        description: 'Países separados por coma. Vacío = todos.'
        required: false
        default: ''
      moneda:
        description: 'USD, CLP, EUR, ARS, BRL, COP, GBP, MXN, PEN'
        required: true
        default: 'USD'
      batch_size:
        description: 'Filas por lote a BigQuery'
        required: true
        default: '500'
      max_minutos:
        description: 'Corte ordenado por shard (watchdog duro)'
        required: true
        default: '300'
      reanudar:
        description: 'Saltar lo ya cargado para ese fecha_scan'
        type: boolean
        required: true
        default: true

concurrency:
  group: operadores-civitatis
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      fecha_scan: ${{ steps.plan.outputs.fecha_scan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fijar fecha_scan común y armar matriz
        id: plan
        env:
          TOTAL_SHARDS: ${{ inputs.total_shards }}
          FECHA_INPUT: ${{ inputs.fecha_scan }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          n = int(os.environ["TOTAL_SHARDS"])
          fecha = os.environ.get("FECHA_INPUT") or datetime.now(timezone.utc).strftime("%Y-%m-%d")
          print(f"shards={json.dumps(list(range(n)))}")
          print(f"fecha_scan={fecha}")
          PY

  scrapear:
    needs: preparar
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_paralelo) }}
      matrix:
        shard: ${{ fromJSON(needs.preparar.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias
        # Sin Playwright: el motor http sólo necesita httpx + beautifulsoup4.
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 pandas pyarrow "google-cloud-bigquery[pandas]" db-dtypes

      - name: Scrapear shard ${{ matrix.shard }}
        env:
          FECHA_SCAN: ${{ needs.preparar.outputs.fecha_scan }}
          PAISES: ${{ inputs.paises }}
        run: |
          ARGS=(
            --motor http
            --shard "${{ matrix.shard }}"
            --total-shards "${{ inputs.total_shards }}"
            --moneda "${{ inputs.moneda }}"
            --fecha-scan "$FECHA_SCAN"
            --batch-size "${{ inputs.batch_size }}"
            --max-minutos "${{ inputs.max_minutos }}"
            --concurrencia "${{ inputs.concurrencia }}"
            --pausa "${{ inputs.pausa }}"
            --progreso "progreso/operadores_shard_${{ matrix.shard }}.json"
            --csv-respaldo "progreso/operadores_shard_${{ matrix.shard }}.csv"
          )
          if [ -n "$PAISES" ]; then ARGS+=(--paises "$PAISES"); fi
          if [ "${{ inputs.reanudar }}" != "true" ]; then ARGS+=(--no-reanudar); fi
          python main_operadores.py "${ARGS[@]}"

      - name: Guardar progreso como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progreso-shard-${{ matrix.shard }}
          path: progreso/
          retention-days: 7
          if-no-files-found: warn

      - name: Limpiar workspace del runner self-hosted
        if: always()
        run: rm -rf progreso data/urls_actividades_civitatis.txt || true

  resumen:
    needs: [preparar, scrapear]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias
        run: pip install pandas "google-cloud-bigquery[pandas]" pyarrow db-dtypes httpx beautifulsoup4

      - name: Descargar progreso de todos los shards
        uses: actions/download-artifact@v4
        with:
          pattern: progreso-shard-*
          path: progreso_todos
          merge-multiple: true

      - name: Estado por shard
        run: |
          {
            echo "## 🧭 Estado por shard"
            echo ""
            echo "| Shard | Estado | Asignadas | Fichas OK | Error | 404 | Filas | Lotes | 429/406 |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          for ruta in sorted(glob.glob("progreso_todos/**/*.json", recursive=True),
                             key=lambda p: json.load(open(p)).get("shard", 0)):
              d = json.load(open(ruta))
              print("| {} | {} | {} | {} | {} | {} | {} | {} | {} |".format(
                  d.get("shard"), d.get("estado"), d.get("destinos_asignados"),
                  d.get("scraper_fichas_ok", "-"), d.get("scraper_fichas_error", "-"),
                  d.get("scraper_fichas_404", "-"), d.get("filas_subidas"),
                  d.get("lotes_subidos"), d.get("scraper_http_bloqueos", "-")))
          PY

      - name: Totales en BigQuery
        continue-on-error: true
        run: |
          python main_operadores.py --resumen-bq \
            --fecha-scan "${{ needs.preparar.outputs.fecha_scan }}"
