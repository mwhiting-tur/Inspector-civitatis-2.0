name: GYG Scraper Pipeline (Sitemaps -> Precios -> BigQuery)

on:
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch: {}
  
  # Programado para correr todos los viernes a las 2:00 AM (UTC)
  schedule:
    - cron: '0 2 * * 5'

jobs:
  # ==========================================
  # JOB 1: Extraer URLs de los Sitemaps
  # ==========================================
  extract_sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias para Sitemaps
        run: pip install pandas requests

      - name: Ejecutar Script de Sitemaps
        run: python gyg_sitemap_github.py

      - name: Guardar CSV de URLs como Artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: sitemaps_data
          path: tours_latam_urls.csv
          retention-days: 1

  # ==========================================
  # JOB 2: Extraer Precios y subir a BigQuery
  # ==========================================
  extract_prices_and_upload:
    needs: extract_sitemaps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar CSV del Job anterior
        uses: actions/download-artifact@v4
        with:
          name: sitemaps_data

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Instalar dependencias para Precios y BQ
        run: pip install pandas requests beautifulsoup4 google-cloud-bigquery[pandas] pyarrow db-dtypes

      - name: Ejecutar Script de Precios y Subir a BQ
        run: python gyg_precios_github.py