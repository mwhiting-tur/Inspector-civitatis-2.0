name: GYG Precios – Matrix por IP (Manual)

# Cómo usar: GitHub → Actions → "GYG Precios" → Run workflow
# Cada job corre en una IP distinta de Azure → evita rate-limit

on:
  workflow_dispatch:
    inputs:
      pais:
        description: "Slug del país (ej: chile, mexico, brasil)"
        required: true
        default: "chile"
      fecha:
        description: "Fecha del CSV de IDs (ej: 2026-05-25)"
        required: true
        default: "2026-05-25"
      batch_size:
        description: "Tours por batch/IP (mantener ≤ 25)"
        required: false
        default: "25"

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # Job 1: calcular número de batches dinámicamente
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc.outputs.matrix }}
      total:  ${{ steps.calc.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular batches
        id: calc
        run: |
          CSV="gyg/tours_${{ github.event.inputs.pais }}_IDs_${{ github.event.inputs.fecha }}.csv"
          TOTAL=$(tail -n +2 "$CSV" | wc -l | tr -d ' ')
          BATCH=${{ github.event.inputs.batch_size }}
          NUM=$(python3 -c "import math; print(math.ceil($TOTAL / $BATCH))")
          MATRIX=$(python3 -c "print('[' + ','.join(str(i) for i in range($NUM)) + ']')")
          echo "total=$TOTAL"   >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📊 $TOTAL tours → $NUM batches de $BATCH"

  # Job 2: N jobs paralelos, cada uno con su propia IP
  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15         # cada batch de 25 tarda ~3 min con delays de 5s

    strategy:
      fail-fast: false           # si un batch falla, los demás siguen
      max-parallel: 15           # 15 IPs simultáneas max (ajusta según el plan de GH)
      matrix:
        batch: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install pandas curl_cffi beautifulsoup4

      - name: Scrape batch ${{ matrix.batch }}
        run: |
          OFFSET=$(( ${{ matrix.batch }} * ${{ github.event.inputs.batch_size }} ))
          python gyg/gyg_prices_api.py \
            --archivo "tours_${{ github.event.inputs.pais }}_IDs_${{ github.event.inputs.fecha }}.csv" \
            --offset  $OFFSET \
            --limit   ${{ github.event.inputs.batch_size }} \
            --output  "gyg_batch_${{ matrix.batch }}.csv" \
            --threads 1 \
            --delay-min 4.0 \
            --delay-max 7.0

      - name: Subir resultado del batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "batch-${{ matrix.batch }}"
          path: "gyg_batch_${{ matrix.batch }}.csv"
          retention-days: 7

  # Job 3: merge de todos los batches → un CSV final → commit al repo
  merge:
    needs: scrape
    if: always()                 # corre aunque algún batch haya fallado
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar todos los batches
        uses: actions/download-artifact@v4
        with:
          pattern: "batch-*"
          merge-multiple: true
          path: ./batches/

      - name: Instalar pandas
        run: pip install pandas

      - name: Mergear CSVs
        run: |
          python3 - <<'EOF'
          import pandas as pd, glob, os, sys

          files = sorted(glob.glob("batches/gyg_batch_*.csv"))
          print(f"Batches encontrados: {len(files)}")

          header = "pais;destino;tour_id;nombre_actividad;url;proveedor;total_reseñas;precio_original;precio_promocion;moneda"
          dfs = []
          for f in files:
              if os.path.getsize(f) > len(header):
                  try:
                      dfs.append(pd.read_csv(f, sep=";", encoding="utf-8-sig"))
                  except Exception as e:
                      print(f"  ⚠️  {f}: {e}")

          if not dfs:
              print("❌ No se encontraron datos")
              sys.exit(0)

          merged = pd.concat(dfs).drop_duplicates(subset=["url"])
          out = "gyg_mayo_${{ github.event.inputs.pais }}_FINAL.csv"
          merged.to_csv(out, sep=";", index=False, encoding="utf-8-sig")
          print(f"✅ {len(merged)} tours → {out}")
          EOF

      - name: Subir CSV final como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: "gyg-${{ github.event.inputs.pais }}-final"
          path: "gyg_mayo_${{ github.event.inputs.pais }}_FINAL.csv"
          retention-days: 30

      - name: Commit al repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "gyg_mayo_${{ github.event.inputs.pais }}_FINAL.csv"
          git diff --staged --quiet || git commit -m "chore: GYG precios ${{ github.event.inputs.pais }} [skip ci]"
          git push
