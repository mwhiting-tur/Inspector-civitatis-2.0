name: Deploy TUR Sitemap Matching – Cloud Run

on:
  workflow_dispatch:
  push:
    paths:
      - 'tur/sitemap_cloudrun.py'
      - 'tur/requirements_sitemap.txt'
      - 'tur/Dockerfile.sitemap'
      - '.github/workflows/deploy_tur_sitemap.yml'

env:
  GCP_PROJECT: datatur
  REGION: us-central1
  SERVICE_NAME: tur-sitemap-matching
  IMAGE: gcr.io/datatur/tur-sitemap-matching
  BQ_OUTPUT_TABLE: inspector.tur_sitemap_urls

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Build and push image via Cloud Build
        run: |
          gcloud builds submit tur/ \
            --dockerfile tur/Dockerfile.sitemap \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --project ${{ env.GCP_PROJECT }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 1 \
            --set-env-vars "BQ_PROJECT=${{ env.GCP_PROJECT }},BQ_OUTPUT_TABLE=${{ env.BQ_OUTPUT_TABLE }}" \
            --project ${{ env.GCP_PROJECT }}

      - name: Get service URL
        id: service_url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)' \
            --project ${{ env.GCP_PROJECT }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      # Creates the scheduler job on first deploy; updates it on subsequent deploys
      - name: Create or update Cloud Scheduler job
        run: |
          SA_EMAIL=$(gcloud iam service-accounts list \
            --filter="email:${{ secrets.GCP_SA_EMAIL }}" \
            --format='value(email)' \
            --project ${{ env.GCP_PROJECT }} 2>/dev/null || echo "${{ secrets.GCP_SA_EMAIL }}")

          if gcloud scheduler jobs describe tur-sitemap-weekly \
              --location ${{ env.REGION }} \
              --project ${{ env.GCP_PROJECT }} &>/dev/null; then
            gcloud scheduler jobs update http tur-sitemap-weekly \
              --location ${{ env.REGION }} \
              --schedule "0 4 * * 1" \
              --time-zone "America/Santiago" \
              --uri "${{ steps.service_url.outputs.url }}" \
              --http-method POST \
              --oidc-service-account-email "${{ secrets.GCP_SA_EMAIL }}" \
              --attempt-deadline 300s \
              --project ${{ env.GCP_PROJECT }}
          else
            gcloud scheduler jobs create http tur-sitemap-weekly \
              --location ${{ env.REGION }} \
              --schedule "0 4 * * 1" \
              --time-zone "America/Santiago" \
              --uri "${{ steps.service_url.outputs.url }}" \
              --http-method POST \
              --oidc-service-account-email "${{ secrets.GCP_SA_EMAIL }}" \
              --attempt-deadline 300s \
              --project ${{ env.GCP_PROJECT }}
          fi

      - name: Done
        run: |
          echo "Service: ${{ steps.service_url.outputs.url }}"
          echo "Scheduler: every Monday at 04:00 America/Santiago"
          echo "Output: ${{ env.GCP_PROJECT }}.${{ env.BQ_OUTPUT_TABLE }}"
